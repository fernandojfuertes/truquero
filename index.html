<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"/>
  <title>Truquero</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%231a1a1a'/><g stroke='%23ffffff' stroke-width='3' fill='none'><rect x='30' y='30' width='40' height='40'/><rect x='76' y='30' width='40' height='40'/><rect x='122' y='30' width='40' height='40'/><rect x='30' y='76' width='40' height='40'/><rect x='76' y='76' width='40' height='40'/><rect x='122' y='76' width='40' height='40'/><line x1='30' y1='30' x2='70' y2='70'/><line x1='76' y1='30' x2='116' y2='70'/><line x1='122' y1='30' x2='162' y2='70'/><line x1='30' y1='76' x2='70' y2='116'/><line x1='76' y1='76' x2='116' y2='116'/><line x1='122' y1='76' x2='162' y2='116'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #1a1a1a;
  --bg-card: #1a1a1a;
  --border: #ffffff;
  --text: #ffffff;
  --text-muted: #999999;
  --seg-off: #333333;
  --seg-on: #ffffff;
  --btn-bg: #ffffff;
  --btn-text: #000000;
  --cell: 7.5vh;
  --seg-w: 0.7vh;
  --font: 'Archivo', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --radius: 4px;
  --radius-sm: 2px;
  --line: rgba(255,255,255,.16);
}
body.light {
  --bg: #FFFFFF;
  --bg-card: #FFFFFF;
  --border: #000000;
  --text: #000000;
  --text-muted: #666666;
  --seg-off: #E5E5E5;
  --seg-on: #000000;
  --btn-bg: #000000;
  --btn-text: #FFFFFF;
  --line: rgba(0,0,0,.14);
}
*, *::before, *::after { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body {
  height: 100dvh;
  overflow: hidden;
  position: fixed;
  width: 100%;
  margin: 0;
  touch-action: manipulation;
}
body {
  font-family: var(--font);
  color: var(--text);
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.bottom-actions {
  height: 7vh;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  padding-bottom: env(safe-area-inset-bottom);
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}
.menu-button {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: clamp(9px, 1.2vh, 11px);
  padding: 0.8vh 1.5vh;
  border-radius: var(--radius);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.menu-button:active {
  background: var(--border);
  color: var(--btn-text);
}
.menu-modal {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.menu-item {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: clamp(9px, 1.2vh, 11px);
  padding: 12px 16px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  text-align: left;
  border-radius: var(--radius);
  transition: background 0.15s, color 0.15s;
}
.menu-item:active {
  background: var(--border);
  color: var(--btn-text);
}
.btn-top {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: clamp(9px, 1.2vh, 11px);
  padding: 0.8vh 1.5vh;
  border-radius: var(--radius);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-top svg { width: 14px; height: 14px; flex: 0 0 auto; }
.btn-top:active {
  background: var(--border);
  color: var(--btn-text);
}
/* Reiniciar (semi-destructivo): atenuado para que no compita ni se toque sin querer */
.btn-top.muted { color: var(--text-muted); border-color: var(--line); }
/* Tema: ícono solo, chico, al costado */
.bottom-actions .btn-top.icon-only { flex: 0 0 auto; width: clamp(42px, 12vw, 54px); padding-left: 0; padding-right: 0; }
.btn-top.icon-only svg { width: 16px; height: 16px; }
.board {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  max-width: 424px;
  margin: 0 auto;
  gap: 8px;
  padding: 8px;
  width: 100%;
  min-height: 0;
  position: relative;
  z-index: 1;
}
.board.gallo {
  grid-template-columns: 2fr 1fr;
  max-width: 496px;
}
.dupla-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
  position: relative;
}
.dupla-players {
  display: flex;
  flex: 1;
  min-height: 0;
}
.dupla-divider {
  width: 1px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 8px;
  align-self: stretch;
}
.dupla-player {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
}
.team {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
  transition: box-shadow 0.2s;
  position: relative;
}
.team::before, .team::after { display: none; }
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  margin-bottom: 8px;
}
.name {
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 700;
  background: transparent;
  border: none;
  border-bottom: 1px solid transparent;
  color: var(--text);
  text-align: left;
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  padding: 2px 0;
  transition: border-color 0.2s;
  font-family: var(--font);
}
/* Marcador del equipo que va ganando (agnóstico al nombre) */
.leader-mark { display: none; flex: 0 0 auto; color: var(--text); font-size: 0.6em; margin-right: 4px; }
.leader-mark.on { display: inline; }
.name:read-only { pointer-events: none; }
.name:focus {
  outline: none;
  border-bottom-color: var(--border);
}
.total-display {
  font-size: clamp(16px, 3vh, 26px);
  font-weight: 900;
  color: var(--text);
  text-align: right;
}
.bump { animation: bump 0.2s ease; }
@keyframes bump { 50% { transform: scale(1.25); } }
.section {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 4px 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  margin-top: 0;
}
.section-label {
  font-size: clamp(7px, 1vh, 9px);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-align: center;
  letter-spacing: 0.5px;
  font-weight: 600;
  transition: color 0.2s;
}
/* Sección activa (la que se está llenando) resaltada */
.section-label.active { color: var(--text); font-weight: 800; }
.row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.cell {
  width: var(--cell);
  height: var(--cell);
  position: relative;
  flex-shrink: 1;
}
.seg {
  position: absolute;
  background: var(--seg-off);
  border-radius: var(--radius-sm);
  transition: background 0.2s ease;
}
.p1 { top: 0; left: 15%; right: 15%; height: var(--seg-w); }
.p2 { top: 15%; right: 0; bottom: 15%; width: var(--seg-w); }
.p3 { bottom: 0; left: 15%; right: 15%; height: var(--seg-w); }
.p4 { top: 15%; left: 0; bottom: 15%; width: var(--seg-w); }
.p5 {
  top: 50%; left: 50%; width: 120%; height: var(--seg-w);
  transform: translate(-50%, -50%) rotate(-45deg);
  z-index: 2;
}
.section-malas {
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
  padding-bottom: 4px;
}
.section-malas .seg.on { background: var(--seg-on); }
.section-buenas .seg.on { background: var(--seg-on); }
.section-single .seg.on { background: var(--seg-on); }
#controls { display: none; }
.controls-bar {
  height: 15vh;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  align-items: center;
  justify-items: center;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  position: relative;
  z-index: 1;
}
.controls-bar.gallo { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.team-controls {
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.btn-group {
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}
.btn-action {
  aspect-ratio: 1/1;
  width: 36px;
  height: 36px;
  max-width: 44px;
  max-height: 44px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: clamp(12px, 1.8vh, 16px);
  font-weight: bold;
  color: var(--btn-text);
  background: var(--btn-bg);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.15s, opacity 0.15s;
}
.btn-action:active { transform: scale(0.95); opacity: 0.8; }
.btn-plus { background: var(--btn-bg); color: var(--btn-text); }
/* El panel entero suma +1; el − es secundario (outline) */
.btn-minus { background: transparent; color: var(--text); }
.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tappable:active { background: rgba(127, 127, 127, 0.10); }
@media (max-width: 600px) {
  /* Un poco más de aire respecto a los bordes del teléfono (parejo en los 4 lados) */
  .board { padding: 14px; }
  .board.gallo {
    --cell: 6.5vh;
    --seg-w: 0.5vh;
    gap: 4px;
    padding: 4px;
  }
  .board.gallo .team,
  .board.gallo .dupla-card { padding: 6px; }
  .board.gallo .dupla-divider { margin: 0 4px; }
  .board.gallo .btn-action { width: 32px; height: 32px; font-size: 14px; }
  .board.gallo .name { font-size: clamp(9px, 1.4vh, 12px); }
  .board.gallo .total-display { font-size: clamp(13px, 2.2vh, 18px); }
  .board.gallo .row { gap: 3px; }
  .board.gallo .section-label { margin-bottom: 3px; }
  .board.gallo .header-row { padding-bottom: 4px; margin-bottom: 4px; }
  .board.gallo .team-controls { margin-top: 4px; padding-top: 4px; gap: 4px; }
  .board.gallo .mano-label { margin-bottom: 4px; }
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
.modal-overlay.hidden { display: none; }
/* Entrada de modales: fade + scale-in suave */
@keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn  { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
.modal-overlay:not(.hidden) { animation: modalFade .2s ease; }
.modal-sheet { animation: sheetIn .24s cubic-bezier(.2, .9, .2, 1); }
@media (prefers-reduced-motion: reduce) {
  .modal-overlay:not(.hidden), .modal-sheet { animation: none; }
}
.modal-sheet {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px 20px;
  width: 100%;
  max-width: 440px;
  max-height: 100%;
  overflow-y: auto;
}
.modal-sheet--tall {
  max-height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.modal-title {
  font-size: clamp(14px, 2vh, 18px);
  font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: center;
}
.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-btn-primary,
.modal-btn-secondary {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius);
  font-size: clamp(11px, 1.5vh, 14px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  border: 1px solid var(--border);
}
.modal-btn-primary { background: var(--btn-bg); color: var(--btn-text); }
.modal-btn-secondary { background: var(--bg); color: var(--text); }
.size-selector { display: flex; gap: 8px; margin-bottom: 20px; }
.initial-btn {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  pointer-events: auto;
  position: relative;
  z-index: 10;
}
.initial-btn.active { background: var(--btn-bg); color: var(--btn-text); }
.team-section { margin-bottom: 16px; }
.team-section-label {
  font-size: clamp(9px, 1.2vh, 11px);
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 600;
}
.winner-content { text-align: center; padding: 8px 0 4px; }
.winner-label {
  font-size: clamp(9px, 1.2vh, 11px);
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 600;
}
.winner-name-display {
  font-size: clamp(22px, 4vh, 36px);
  font-weight: 900;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.1;
}
.winner-score-display {
  font-size: clamp(13px, 2vh, 18px);
  color: var(--text-muted);
  font-weight: 600;
}
.history-content { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 8px; }
.history-empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 20px; }
.history-section-title {
  font-size: clamp(9px, 1.2vh, 11px);
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  font-weight: 600;
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.history-stats { display: flex; flex-direction: column; gap: 8px; }
.stat-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--seg-off);
}
.stat-name {
  flex: 1;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.stat-record { font-size: 13px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
.stat-rate { font-size: 13px; color: var(--text); font-weight: 700; white-space: nowrap; min-width: 40px; text-align: right; }
.stat-streak { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.history-games { display: flex; flex-direction: column; gap: 6px; }
.history-load-more {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: clamp(9px, 1.2vh, 11px);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  font-family: var(--font);
}
.history-load-more:active { background: var(--border); color: var(--btn-text); }
.game-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  border-bottom: 1px solid var(--seg-off);
}
.game-date {
  grid-column: 1 / -1;
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.game-winner { font-size: 13px; font-weight: 700; color: var(--text); text-align: right; }
.game-vs { font-size: 11px; color: var(--text-muted); text-align: center; font-weight: 600; }
.game-loser { font-size: 13px; color: var(--text-muted); text-align: left; }
.game-score { font-size: 11px; color: var(--text-muted); text-align: center; }
@media (max-width: 480px) {
  .bottom-actions { gap: 5px; padding-left: 6px; padding-right: 6px; }
  .btn-top { flex: 1; padding: 0.8vh 0; font-size: 9px; letter-spacing: 0.3px; }
}
@media (orientation: landscape) and (max-width: 1023px) {
  :root { --cell: 13vh; --seg-w: 0.9vh; }
  .board { max-width: 440px; gap: 6px; padding: 6px; }
  .board.gallo { max-width: 496px; }
  .section .row { flex-direction: row; justify-content: center; gap: 4px; }
  .section-label { margin-bottom: 4px; }
  .section-malas { margin-bottom: 4px; padding-bottom: 4px; }
  .btn-action { width: 36px; height: 36px; font-size: 18px; }
  .team-controls { margin-top: 4px; padding-top: 4px; }
  .bottom-actions { height: 6vh; max-width: 496px; }
  .bottom-actions .btn-top { flex: 1; padding: 0.6vh 0.8vh; font-size: 12px; }
}
@media (orientation: landscape) and (min-width: 1024px) {
  :root { --cell: 8vh; --seg-w: 0.6vh; }
  .board { max-width: 424px; }
  .board.gallo { max-width: 496px; }
  .bottom-actions { max-width: 800px; }
}
/* === Players selection (roster) === */
.player-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  padding: 10px 12px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
.player-input:focus { border-color: var(--text); }
.slot-row { display: flex; gap: 8px; flex-wrap: wrap; }
.slot {
  flex: 1; min-width: 64px; padding: 10px 8px;
  border: 1px dashed var(--border); border-radius: var(--radius);
  text-align: center; font-size: 13px; color: var(--text-muted);
  cursor: pointer; background: transparent;
}
.slot.filled { border-style: solid; color: var(--text); font-weight: 700; background: var(--bg); }
.roster-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; min-height: 8px; }
.roster-chip {
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px;
  font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text);
}
.roster-chip.used { opacity: 0.35; }
.roster-empty { font-size: 12px; color: var(--text-muted); }
.add-player-row { display: flex; gap: 8px; }
.add-player-row .player-input { flex: 1; }
.add-player-row .modal-btn-secondary { width: 48px; flex: 0 0 auto; padding: 10px; }
.modal-btn-primary:disabled { opacity: 0.4; cursor: default; }
.roster-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.roster-head .team-section-label { margin-bottom: 0; }
.roster-edit-btn {
  background: none; border: none; color: var(--text-muted);
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer; padding: 2px 4px;
}
.roster-chip.deletable { border-color: #e55; color: #e55; }
/* === Buscador / picker de jugadores === */
.mono { width:24px; height:24px; border-radius:50%; border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex:0 0 auto; }
.mono.dashed { border-style:dashed; }

  <script>
// === CONSTANTS ===
const POINTS_PER_CELL    = 5;
const CELLS_PER_SECTION  = 3;
const SEGMENTS_PER_SECTION = POINTS_PER_CELL * CELLS_PER_SECTION; // 15
const GALLO_ROTATION     = [2, 0, 1];
const MAX_HISTORY_PAGE   = 20;
const UNDO_LIMIT         = 10;
const DEFAULT_NAMES      = ['Nosotros', 'Ellos'];
const GALLO_NAMES        = ['Yo', 'El', 'Gallo'];

// === STATE ===
const state = {
  teams: [
    { name: DEFAULT_NAMES[0], score: 0 },
    { name: DEFAULT_NAMES[1], score: 0 }

  TARGET: 30,
  mano: 0
};

let rankedConfig = { active: false, teamSize: 1, teams: [[], []] };
let gameHistory  = [];
let undoStack    = [];
let roster       = [];
let selection    = { format: 1, slots: [[], []] };
let rosterEditMode = false;
let quickMode    = false;   // true en "Jugar rápido" (sin trackear)
let searchQuery  = '';

// === DOM REFS ===
const board            = document.getElementById('board');
const controls         = document.getElementById('controls');
const toggleGalloBtn   = document.getElementById('toggleGallo');
const siguienteManoBtn = document.getElementById('siguienteMano');

const historyOverlay   = document.getElementById('historyOverlay');

const menuModal        = document.getElementById('menuModal');

// === ELEMENT CACHE ===
let teamElements       = [];
let savedGallo         = null;
let pendingWinnerIndex = -1;
let historyPage        = {};
let initialMode        = 'dupla';
let initialPoints      = 30;

// === PERSISTENCE (disabled) ===
function saveState() {}
function loadState() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {
    console.warn('AudioContext no disponible:', e);
  }
}
// --- Supabase (fuente compartida en la nube) ---
const SB_URL  = 'https://mmnqydvkajtrrzmzypzl.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbnF5ZHZrYWp0cnJ6bXp5cHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5Mzc5ODIsImV4cCI6MjA5NzUxMzk4Mn0.vtl0Ymiay1ZoMXjGlJgwB2ThbISabhypw_oTz85WkzE';
const sb = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SB_URL, SB_ANON)
  : null;

const LS_HISTORY = 'truquero_history_v1';
const LS_ROSTER  = 'truquero_roster_v1';
const LS_PENDING = 'truquero_pending_v1';

// --- Caché local (lectura instantánea + offline) ---
function loadHistory() { try { gameHistory = JSON.parse(localStorage.getItem(LS_HISTORY)) || []; } catch(e) { gameHistory = []; } }
function saveHistory() { try { localStorage.setItem(LS_HISTORY, JSON.stringify(gameHistory)); } catch(e) {} }
function loadRoster()  { try { roster = JSON.parse(localStorage.getItem(LS_ROSTER)) || []; } catch(e) { roster = []; } }
function saveRoster()  { try { localStorage.setItem(LS_ROSTER, JSON.stringify(roster)); } catch(e) {} }

// --- Cola de escrituras pendientes (cuando no hay conexión) ---
function loadPending()      { try { return JSON.parse(localStorage.getItem(LS_PENDING)) || []; } catch(e) { return []; } }
function savePending(q)     { try { localStorage.setItem(LS_PENDING, JSON.stringify(q)); } catch(e) {} }
function queuePending(item) { const q = loadPending(); q.push(item); savePending(q); }

// --- Escritura a Supabase (best-effort; si falla, encola) ---
async function sbUpsert(table, row) {
  if (!sb) { queuePending({ table, row }); updateSyncStatus(); return; }
  try {
    // ignoreDuplicates -> ON CONFLICT DO NOTHING: idempotente y solo requiere política de INSERT.
    const { error } = await sb.from(table).upsert(row, { ignoreDuplicates: true });
    if (error) throw error;
  } catch(e) {
    console.warn('Supabase no disponible, encolado:', e?.message || e);
    queuePending({ table, row });
  }
  updateSyncStatus();
}
async function sbDelete(table, id) {
  if (!sb) { queuePending({ table, op: 'delete', id }); updateSyncStatus(); return; }
  try {
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) throw error;
  } catch(e) {
    console.warn('Supabase delete falló, encolado:', e?.message || e);
    queuePending({ table, op: 'delete', id });
  }
  updateSyncStatus();
}
async function flushPending() {
  if (!sb) return;
  const q = loadPending();
  if (!q.length) return;
  const rest = [];
  for (const it of q) {
    try {
      const { error } = it.op === 'delete'
        ? await sb.from(it.table).delete().eq('id', it.id)
        : await sb.from(it.table).upsert(it.row, { ignoreDuplicates: true });
      if (error) throw error;
    } catch(e) { rest.push(it); }
  }
  savePending(rest);
  updateSyncStatus();
}

// Indicador de sincronización en pantalla
function updateSyncStatus() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const pending = loadPending().length;
  if (!sb || !navigator.onLine) {
    el.textContent = pending ? `⚠ Sin conexión · ${pending} sin guardar` : '⚠ Sin conexión';
    el.className = 'sync-status offline';
  } else if (pending) {
    el.textContent = `↻ ${pending} sin guardar`;
    el.className = 'sync-status pending';
  } else {
    // Todo sincronizado: no molestamos, ocultamos el indicador.
    el.className = 'sync-status hidden';
    el.textContent = '';
  }
}

// --- Sincronización desde Supabase (refresca la caché) ---
async function syncRoster() {
  if (!sb) return;
  try {
    const { data, error } = await sb.from('players').select('id,name').order('created_at');
    if (error) throw error;
    roster = data.map(r => ({ id: r.id, name: r.name }));
    saveRoster();
    if (playersModal && !playersModal.classList.contains('hidden')) renderPlayersSelection();
  } catch(e) { console.warn('syncRoster:', e?.message || e); }
}
async function syncHistory() {
  if (!sb) return;
  try {
    const { data, error } = await sb.from('games').select('*').order('date', { ascending: false });
    if (error) throw error;
    gameHistory = data.map(g => ({
      id: g.id, date: g.date, teamSize: g.team_size, mode: g.mode, teams: g.teams, winnerKey: g.winner_key
    }));
    saveHistory();
    if (historyOverlay && !historyOverlay.classList.contains('hidden')) renderHistoryView();
  } catch(e) { console.warn('syncHistory:', e?.message || e); }
}

// === THEME ===
function loadTheme() {
  if (localStorage.getItem('lightMode') === 'true') document.body.classList.add('light');
  updateThemeBtn();
}

function toggleTheme() {

const ICON_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="17.4" y2="6.6"/><line x1="6.6" y1="17.4" x2="5.2" y2="18.8"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
function updateThemeBtn() {
  if (toggleDarkBtn) toggleDarkBtn.innerHTML = document.body.classList.contains('light') ? ICON_SUN : ICON_MOON;
}

// === TARGET TOGGLE ===
function toggleTarget() {
  state.TARGET = state.TARGET === 30 ? 15 : 30;
  state.teams.forEach(t => { t.score = 0; });
  undoStack = [];
  updateTargetBtn();
  render();
  saveState();
}

function updateTargetBtn() {
  if (toggleTargetBtn) {
    const nextTarget = state.TARGET === 15 ? 30 : 15;
    toggleTargetBtn.textContent = `${nextTarget} puntos`;
  }
}

// === SOUND ===
let audioCtx = null;

function playTone(freq, duration, type = 'sine', gainVal = 0.3) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {
    console.warn('Error reproduciendo sonido:', e);
  }
}

function soundAdd()    { playTone(660, 0.12, 'sine', 0.45); }
function soundRemove() { playTone(220, 0.1, 'sine', 0.3); }
// "Clink" de moneda estilo Mario (B5 -> E6, onda cuadrada) al cruzar a Buenas.
function soundCoin() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(987.77, t);          // B5
    osc.frequency.setValueAtTime(1318.51, t + 0.07);  // E6
    gain.gain.setValueAtTime(0.45, t);
    gain.gain.setValueAtTime(0.45, t + 0.07);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.start(t);
    osc.stop(t + 0.5);
  } catch(e) {
    console.warn('Error reproduciendo sonido:', e);
  }
}

// === HELPERS ===
function teamKey(players) {
  return [...players].sort().join('+');
}

function comboKey(ids) { return [...ids].sort().join('+'); }
function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function rosterName(id) { const p = roster.find(r => r.id === id); return p ? p.name : '¿?'; }
function namesOf(ids) { return (ids || []).map(rosterName); }
function addRosterPlayer(name) {
  name = (name || '').trim();
  if (!name) return null;
  const existing = roster.find(r => r.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const p = { id: genId(), name };
  roster.push(p);
  saveRoster();
  sbUpsert('players', { id: p.id, name: p.name });
  return p;
}

function teamLabel(players) {
  if (!players?.length) return '';
  if (players.length === 1) return players[0];
  if (players.length === 2) return `${players[0]} y ${players[1]}`;
  return `${players.slice(0, -1).join(', ')} y ${players[players.length - 1]}`;
}

function teamInitials(players) {
  if (!players?.length) return '';
  return players.map(p => (p.trim()[0] || '?').toUpperCase()).join('·');
}

// === GALLO PAIR ===
function getGalloPair() {
  const galloIdx = GALLO_ROTATION[state.mano % GALLO_ROTATION.length];
  return { galloIdx, pairIdx: [0, 1, 2].filter(i => i !== galloIdx) };
}

// === SEGMENTS ===
function updateSegments(segmentEls, totalScore) {
  const numSections = segmentEls.length / SEGMENTS_PER_SECTION;
  for (let section = 0; section < numSections; section++) {
    const offset    = section * SEGMENTS_PER_SECTION;
    const inSection = Math.max(0, Math.min(SEGMENTS_PER_SECTION, totalScore - offset));
    for (let cell = 0; cell < CELLS_PER_SECTION; cell++) {
      const cellPts = Math.max(0, Math.min(POINTS_PER_CELL, inSection - cell * POINTS_PER_CELL));
      for (let seg = 0; seg < POINTS_PER_CELL; seg++) {
        segmentEls[section * SEGMENTS_PER_SECTION + cell * POINTS_PER_CELL + seg]
          .classList.toggle('on', (seg + 1) <= cellPts);
      }
    }
  }
}

// El número grande cuenta por sección: 1→15 (Malas) y de nuevo 1→15 (Buenas).
function sectionCount(score) { return score <= 0 ? 0 : ((score - 1) % 15) + 1; }

function updateScore(index) {
  const refs = teamElements[index]?._refs;
  if (!refs) return;
  const score = state.teams[index].score;
  refs.totalDisplay.textContent = sectionCount(score);
  refs.totalDisplay.setAttribute('aria-label', `Puntos: ${score}`);
  refs.totalDisplay.classList.remove('bump');
  void refs.totalDisplay.offsetWidth;
  refs.totalDisplay.classList.add('bump');
  updateSegments(refs.segments, score);
  updateActiveSection(refs, score);
  updateLeader();
}

// Resalta la sección que se está llenando: Malas (hasta 15) y luego Buenas.
function updateActiveSection(refs, score) {
  if (!refs.labels) return;
  const inBuenas = score >= 16;
  refs.labels[0]?.classList.toggle('active', !inBuenas);  // Malas
  refs.labels[1]?.classList.toggle('active', inBuenas);   // Buenas
}

// Marca con un ▲ al equipo que va ganando (agnóstico al nombre, monocromo).
function updateLeader() {
  if (!state.teams.length) return;
  const max = Math.max(...state.teams.map(t => t.score));
  const leaders = state.teams.filter(t => t.score === max).length;
  state.teams.forEach((t, i) => {
    const mark = teamElements[i]?._refs?.leaderMark;
    if (mark) mark.classList.toggle('on', max > 0 && leaders === 1 && t.score === max);
  });
}

// === DOM BUILDING ===
function buildSections(container) {
  const segments = [];
  const labels = [];
  // Siempre dos secciones de 15 (Malas + Buenas); el 15/30 solo cambia el objetivo de victoria.
  const defs = [
    { label: 'Malas',  cls: 'section section-malas'  },
    { label: 'Buenas', cls: 'section section-buenas' }
  ];

  defs.forEach(({ label, cls }) => {
    const section = document.createElement('div');
    section.className = cls;

    if (label) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = label;
      section.appendChild(lbl);
      labels.push(lbl);
    }

    const row = document.createElement('div');
    row.className = 'row';
    for (let cell = 0; cell < CELLS_PER_SECTION; cell++) {
      const cellDiv = document.createElement('div');
      cellDiv.className = 'cell';
      for (let seg = 1; seg <= POINTS_PER_CELL; seg++) {
        const s = document.createElement('div');
        s.className = 'seg p' + seg;
        cellDiv.appendChild(s);
        segments.push(s);
      }
      row.appendChild(cellDiv);
    }
    section.appendChild(row);
    container.appendChild(section);
  });
  return { segments, labels };
}

function buildScorePanel(team, index, { className, showControls }) {
  const el = document.createElement('div');
  el.className = className;

  const headerRow = document.createElement('div');
  headerRow.className = 'header-row';

  const nameInput = document.createElement('input');
  nameInput.className = 'name';
  nameInput.value = team.name;
  // En "Jugar rápido" los nombres son fijos y no editables.
  nameInput.readOnly = quickMode;
  nameInput.setAttribute('aria-label', `Nombre del equipo ${index + 1}`);
  nameInput.addEventListener('input', e => {
    state.teams[index].name = e.target.value;
    saveState();
  });

  const leaderMark = document.createElement('span');
  leaderMark.className = 'leader-mark';
  leaderMark.textContent = '▲';
  leaderMark.setAttribute('aria-hidden', 'true');

  const totalDisplay = document.createElement('div');
  totalDisplay.className = 'total-display';
  totalDisplay.textContent = sectionCount(team.score);
  totalDisplay.setAttribute('aria-live', 'polite');
  totalDisplay.setAttribute('aria-label', `Puntos: ${team.score}`);

  headerRow.append(nameInput, leaderMark, totalDisplay);
  el.appendChild(headerRow);

  const { segments, labels } = buildSections(el);

  if (showControls) {
    // Tocar en cualquier parte del panel suma +1; el "−" chico corrige.
    el.classList.add('tappable');
    el.addEventListener('click', e => {
      if (e.target.closest('.name') || e.target.closest('.btn-minus')) return;
      addPoints(index, 1);
    });

    const teamControls = document.createElement('div');
    teamControls.className = 'team-controls';

    const minusBtn = document.createElement('button');
    minusBtn.className = 'btn-action btn-minus';
    minusBtn.textContent = '−';
    minusBtn.setAttribute('aria-label', `Restar un punto a ${team.name}`);
    minusBtn.addEventListener('click', e => { e.stopPropagation(); addPoints(index, -1); });

    teamControls.appendChild(minusBtn);
    el.appendChild(teamControls);
  }

  el._refs = { nameInput, totalDisplay, segments, leaderMark, labels };
  return el;
}

function buildTeamElement(team, index) {
  return buildScorePanel(team, index, { className: 'team', showControls: true });
}

function buildPlayerColumn(team, index) {
  return buildScorePanel(team, index, { className: 'dupla-player', showControls: false });
}

function buildDuplaCard(pairIdx) {
  const card = document.createElement('div');
  card.className = 'dupla-card';

  const playersRow = document.createElement('div');
  playersRow.className = 'dupla-players';

  pairIdx.forEach((idx, i) => {
    if (i > 0) {
      const div = document.createElement('div');
      div.className = 'dupla-divider';
      playersRow.appendChild(div);
    }
    const col = buildPlayerColumn(state.teams[idx], idx);
    playersRow.appendChild(col);
    teamElements[idx] = col;
    updateSegments(col._refs.segments, state.teams[idx].score);
  });

  card.appendChild(playersRow);

  // Tocar la tarjeta de la dupla suma +1 a ambos; el "−" corrige.
  card.classList.add('tappable');
  card.addEventListener('click', e => {
    if (e.target.closest('.name') || e.target.closest('.btn-minus')) return;
    addPointsDupla(1);
  });

  const sharedControls = document.createElement('div');
  sharedControls.className = 'team-controls';

  const minusBtn = document.createElement('button');
  minusBtn.className = 'btn-action btn-minus';
  minusBtn.textContent = '−';
  minusBtn.setAttribute('aria-label', 'Restar un punto a la dupla');
  minusBtn.addEventListener('click', e => { e.stopPropagation(); addPointsDupla(-1); });

  sharedControls.appendChild(minusBtn);
  card.appendChild(sharedControls);
  return card;
}

function buildControlGroup(index) {
  const group = document.createElement('div');
  group.className = 'btn-group';
  const minus = document.createElement('button');
  minus.className = 'btn-action btn-minus';
  minus.textContent = '-';
  minus.setAttribute('aria-label', `Restar punto a ${state.teams[index].name}`);
  minus.addEventListener('click', () => addPoints(index, -1));
  const plus = document.createElement('button');
  plus.className = 'btn-action btn-plus';
  plus.textContent = '+';
  plus.setAttribute('aria-label', `Sumar punto a ${state.teams[index].name}`);
  plus.addEventListener('click', () => addPoints(index, 1));
  group.append(minus, plus);
  return group;
}

// === RENDER ===
function render() {
  board.innerHTML = '';
  controls.innerHTML = '';
  teamElements = [];

  const isGallo = state.teams.length === 3;
  if (toggleGalloBtn) toggleGalloBtn.textContent = 'Gallo';
  if (siguienteManoBtn) siguienteManoBtn.style.display = isGallo ? '' : 'none';
  if (historyBtn) historyBtn.style.display = quickMode ? 'none' : '';

  if (isGallo) {
    board.className = 'board gallo';
    renderGalloBoard();
  } else {
    board.className = 'board';
    state.teams.forEach((team, index) => {
      const teamEl = buildTeamElement(team, index);
      board.appendChild(teamEl);
      teamElements[index] = teamEl;
      controls.appendChild(buildControlGroup(index));
      updateSegments(teamEl._refs.segments, team.score);
    });
  }
  updateLeader();
  teamElements.forEach((el, i) => { if (el && el._refs) updateActiveSection(el._refs, state.teams[i].score); });
}

function renderGalloBoard() {
  const { pairIdx, galloIdx } = getGalloPair();
  board.appendChild(buildDuplaCard(pairIdx));

  const galloCard = buildTeamElement(state.teams[galloIdx], galloIdx);
  board.appendChild(galloCard);
  teamElements[galloIdx] = galloCard;
  updateSegments(galloCard._refs.segments, state.teams[galloIdx].score);
}

// === UNDO ===
function pushUndo() {
  undoStack.push(JSON.stringify({
    teams: state.teams.map(t => ({ ...t })),
    mano: state.mano
  }));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
}

function undo() {
  if (!undoStack.length) return;
  const snapshot = JSON.parse(undoStack.pop());
  if (snapshot.teams.length !== state.teams.length) { undoStack = []; return; }
  snapshot.teams.forEach((t, i) => {
    state.teams[i].score = t.score;
    state.teams[i].name  = t.name;
  });
  state.mano = snapshot.mano;
  state.teams.forEach((_, i) => updateScore(i));
  saveState();
}

// === ACTIONS ===
function addPoints(index, delta, { skipUndo = false } = {}) {
  const team = state.teams[index];
  const prev = team.score;
  const next = Math.max(0, Math.min(state.TARGET, team.score + delta));
  if (next === prev) return;
  if (!skipUndo) pushUndo();
  team.score = next;
  if (delta > 0) {
    (prev < 16 && next >= 16) ? soundCoin() : soundAdd();  // moneda al entrar a Buenas
  } else {
    soundRemove();
  }
  updateScore(index);
  saveState();
  if (team.score === state.TARGET && state.teams.length >= 2 && rankedConfig.active) {
    showWinnerOverlay(index);
  }
}

function addPointsDupla(delta) {
  pushUndo();
  getGalloPair().pairIdx.forEach(idx => addPoints(idx, delta, { skipUndo: true }));
}

function siguienteMano() {
  state.mano += 1;
  render();
  saveState();
}

  location.reload();
}

function saveGame(winnerIndex) {

    id:        genId(),
    date:      new Date().toISOString(),
    teamSize:  rankedConfig.teamSize,
    mode:      rankedConfig.mode || 'normal',
    teams:     rankedConfig.teams.map((ids, i) => ({
      playerIds: ids,
      names:     namesOf(ids),
      score:     state.teams[i].score
    })),
    winnerKey: comboKey(rankedConfig.teams[winnerIndex])
  };

// === HISTORY VIEW ===
function openHistory() {
  historyPage = {};
  renderHistoryView();
  historyOverlay.classList.remove('hidden');
}

function renderHistoryView() {
  const content = document.getElementById('historyContent');

  if (gameHistory.length === 0) {
    content.innerHTML = '<p class="history-empty">Todavía no hay partidas registradas.</p>';
    return;
  }

  let html = '';

  // --- Estadísticas individuales (todas las partidas, sin importar con quién) ---
  const indiv = {};
  gameHistory.forEach(game => {
    game.teams.forEach(team => {
      const ids = team.playerIds || [];
      const isWinner = comboKey(ids) === game.winnerKey;
      ids.forEach((id, idx) => {
        if (!indiv[id]) indiv[id] = { name: team.names?.[idx] || rosterName(id) || '¿?', wins: 0, games: 0 };
        indiv[id].games++;
        if (isWinner) indiv[id].wins++;
      });
    });
  });
  const indivSorted = Object.values(indiv).sort((a, b) =>
    b.wins - a.wins || (b.wins / b.games) - (a.wins / a.games));

  if (indivSorted.length) {
    html += '<div class="history-section-title">Individual</div>';
    html += '<div class="history-stats">';
    indivSorted.forEach(s => {
      const rate = s.games ? Math.round(s.wins / s.games * 100) : 0;
      html += `
        <div class="stat-row">
          <span class="stat-name">${s.name}</span>
          <span class="stat-record">${s.wins}G&nbsp;${s.games - s.wins}P</span>
          <span class="stat-rate">${rate}%</span>
        </div>`;
    });
    html += '</div>';
  }

  // Gallo (3 jugadores) va en su propia sección; el resto se agrupa por formato.
  const isGalloGame = g => g.mode === 'gallo' || (g.teams && g.teams.length === 3);
  const galloGames  = gameHistory.filter(isGalloGame);

  // --- Combinaciones + partidas, agrupadas por formato ---
  const byMode = {};
  gameHistory.filter(g => !isGalloGame(g)).forEach(game => {
    const size = game.teamSize || 1;
    if (!byMode[size]) byMode[size] = [];
    byMode[size].push(game);
  });

  const FORMAT_LABEL = { 1: '1v1 (mano a mano)', 2: 'Parejas (2v2)', 3: 'Triejas (3v3)' };

  [1, 2, 3].forEach(size => {
    const games = byMode[size];
    if (!games) return;

    const modeLabel = FORMAT_LABEL[size];
    const page      = historyPage[size] || 1;
    const shown     = page * MAX_HISTORY_PAGE;

    // Las combinaciones (pareja/trieja) solo aportan estadística propia con 2+ jugadores;
    // en 1v1 la "combinación" es el individuo y ya está arriba.
    if (size !== 1) {
      const stats = {};
      games.forEach(game => {
        game.teams.forEach(team => {
          const ids = team.playerIds || [];
          const key = comboKey(ids);
          if (!stats[key]) stats[key] = { label: teamLabel(team.names || namesOf(ids)), wins: 0, games: 0 };
          stats[key].games++;
          if (key === game.winnerKey) stats[key].wins++;
        });
      });

      Object.keys(stats).forEach(key => {
        let streak = 0;
        for (const game of games) {
          if (!game.teams.some(t => comboKey(t.playerIds || []) === key)) continue;
          if (game.winnerKey === key) streak++;
          else break;
        }
        stats[key].streak  = streak;
        stats[key].winRate = stats[key].games
          ? Math.round(stats[key].wins / stats[key].games * 100) : 0;
      });

      const sorted = Object.values(stats).sort((a, b) => b.wins - a.wins || b.winRate - a.winRate);

      html += `<div class="history-section-title" style="margin-top:16px">${modeLabel} — Estadísticas</div>`;
      html += '<div class="history-stats">';
      sorted.forEach(s => {
        const streak = s.streak >= 2
          ? `<span class="stat-streak">${s.streak} seguidas</span>` : '';
        html += `
          <div class="stat-row">
            <span class="stat-name">${s.label}</span>
            <span class="stat-record">${s.wins}G&nbsp;${s.games - s.wins}P</span>
            <span class="stat-rate">${s.winRate}%</span>
            ${streak}
          </div>`;
      });
      html += '</div>';
    }

    html += `<div class="history-section-title" style="margin-top:16px">${modeLabel} — Partidas</div>`;
    html += '<div class="history-games">';
    games.slice(0, shown).forEach(game => {
      const d       = new Date(game.date);
      const dateStr = `${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const winner  = game.teams.find(t => comboKey(t.playerIds || []) === game.winnerKey);
      const loser   = game.teams.find(t => comboKey(t.playerIds || []) !== game.winnerKey);
      html += `
        <div class="game-row">
          <span class="game-date">${dateStr}</span>
          <span class="game-result">
            <span class="game-winner">${teamLabel(winner?.names || namesOf(winner?.playerIds))}</span>
            <span class="game-vs"> vs </span>
            <span class="game-loser">${teamLabel(loser?.names || namesOf(loser?.playerIds))}</span>
          </span>
          <span class="game-score">${winner?.score ?? 0}–${loser?.score ?? 0}</span>
        </div>`;
    });

    if (games.length > shown) {
      html += `<button class="history-load-more" data-mode="${size}">Ver más (${games.length - shown} restantes)</button>`;
    }

    html += '</div>';
  });

  // --- Gallo — Partidas (3 jugadores; el Individual de arriba ya suma cada uno) ---
  if (galloGames.length) {
    const page  = historyPage['gallo'] || 1;
    const shown = page * MAX_HISTORY_PAGE;
    html += '<div class="history-section-title" style="margin-top:16px">Gallo — Partidas</div>';
    html += '<div class="history-games">';
    galloGames.slice(0, shown).forEach(game => {
      const d       = new Date(game.date);
      const dateStr = `${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const winner  = game.teams.find(t => comboKey(t.playerIds || []) === game.winnerKey);
      const others  = game.teams.filter(t => comboKey(t.playerIds || []) !== game.winnerKey);
      html += `
        <div class="game-row">
          <span class="game-date">${dateStr}</span>
          <span class="game-result">
            <span class="game-winner">${teamLabel(winner?.names || namesOf(winner?.playerIds))}</span>
            <span class="game-vs"> ganó a </span>
            <span class="game-loser">${others.map(o => teamLabel(o.names || namesOf(o.playerIds))).join(', ')}</span>
          </span>
          <span class="game-score">${winner?.score ?? 0}</span>
        </div>`;
    });
    if (galloGames.length > shown) {
      html += `<button class="history-load-more" data-mode="gallo">Ver más (${galloGames.length - shown} restantes)</button>`;
    }
    html += '</div>';
  }

  content.innerHTML = html;

  content.querySelectorAll('.history-load-more').forEach(btn => {
    btn.addEventListener('click', () => {
      const raw = btn.dataset.mode;
      const key = raw === 'gallo' ? 'gallo' : parseInt(raw);
      historyPage[key] = (historyPage[key] || 1) + 1;
      renderHistoryView();
    });
  });
}

// === KEYBOARD SHORTCUTS ===
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ([winnerOverlay, confirmModal, menuModal, playersModal, initialModal].some(m => !m.classList.contains('hidden'))) return;

  const isGallo = state.teams.length === 3;

  switch(e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      if (isGallo) {
        e.shiftKey ? addPointsDupla(-1) : addPointsDupla(1);
      } else {
        e.shiftKey ? addPoints(0, -1) : addPoints(0, 1);
      }
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (isGallo) {
        const { galloIdx } = getGalloPair();
        e.shiftKey ? addPoints(galloIdx, -1) : addPoints(galloIdx, 1);
      } else {
        e.shiftKey ? addPoints(1, -1) : addPoints(1, 1);
      }
      break;
    case 'z':
    case 'Z':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        undo();
      }
      break;
  }
});

  ];
  state.mano = 0;
  savedGallo = null;
  if (initialMode === 'gallo') {
    state.teams[0].name = 'Yo';
    state.teams[1].name = 'El';
    state.teams.push({ name: 'Gallo', score: 0 });
  }
  rankedConfig = { active: false, teamSize: 1, teams: [[], []] };
  undoStack = [];
  quickMode = true;
  initialModal.classList.add('hidden');
  document.body.classList.remove('config');
  render();
  saveState();
}

// === PLAYERS SELECTION (partidas con historial) ===
// Capacidad de jugadores por equipo según el modo de selección.
function selectionCap() { return selection.mode === 'gallo' ? 1 : selection.format; }
function monoOf(name) { const c = (name || '?').trim()[0] || '?'; return c.toUpperCase(); }
function teamLabelFor(t) { return selection.mode === 'gallo' ? 'Jugador ' + (t + 1) : 'Equipo ' + (t + 1); }
function teamOfPlayer(id) {
  for (let t = 0; t < selection.slots.length; t++) if (selection.slots[t].includes(id)) return t;
  return -1;
}

function openPlayersModal() {
  rosterEditMode = false;
  searchQuery = '';
  const eb = document.getElementById('editRosterBtn'); if (eb) eb.textContent = 'Editar';
  const si = document.getElementById('playerSearch'); if (si) si.value = '';
  selection = initialMode === 'gallo'
    ? { mode: 'gallo', format: 1, slots: [[], [], []] }
    : { mode: 'normal', format: 1, slots: [[], []] };
  document.querySelectorAll('#formatSelector .initial-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.format) === selection.format));
  renderPlayersSelection();
  initialModal.classList.add('hidden');
  playersModal.classList.remove('hidden');
}

function renderPlayersSelection() {
  const gallo = selection.mode === 'gallo';
  const cap   = selectionCap();
  document.getElementById('formatSection').style.display = gallo ? 'none' : '';

  // Equipos fijos arriba
  let th = '';
  selection.slots.forEach((ids, t) => {
    let chips = ids.map(id =>
      `<span class="tchip" data-remove="${id}"><span class="mono">${monoOf(rosterName(id))}</span>${rosterName(id)} <span class="x">✕</span></span>`
    ).join('');
    for (let i = ids.length; i < cap; i++) chips += '<span class="tslot">libre</span>';
    th += `<div class="team-line"><span class="tlabel">${teamLabelFor(t)}</span>`
        + `<span class="tchips">${chips}</span><span class="cap">${ids.length}/${cap}</span></div>`;
  });
  document.getElementById('teamsPinned').innerHTML = th;

  // Pool de jugadores (buscador + recientes)
  const q = searchQuery.trim().toLowerCase();
  const full = selection.slots.every(s => s.length === cap);
  const rowFor = (p) => {
    const mono = `<span class="mono">${monoOf(p.name)}</span>`;
    if (rosterEditMode)
      return `<div class="prow del" data-del="${p.id}">${mono}<span class="nm">${p.name}</span><button class="padd danger">✕</button></div>`;
    const t = teamOfPlayer(p.id);
    if (t >= 0)
      return `<div class="prow in" data-remove="${p.id}">${mono}<span class="nm">${p.name} · ${teamLabelFor(t)}</span><button class="padd">✓</button></div>`;
    return `<div class="prow" data-add="${p.id}">${mono}<span class="nm">${p.name}</span><button class="padd"${full ? ' disabled' : ''}>＋</button></div>`;
  };

  let ph = '';
  if (!roster.length && !q) {
    ph = '<div class="pool-empty">Todavía no hay jugadores. Escribí un nombre arriba y creá el primero.</div>';
  } else if (q) {
    const matches = roster.filter(p => p.name.toLowerCase().includes(q));
    ph += matches.length ? matches.map(rowFor).join('') : '<div class="pool-empty">Sin coincidencias.</div>';
    const exact = roster.some(p => p.name.toLowerCase() === q);
    if (!exact && !rosterEditMode)
      ph += `<div class="prow create" data-create="1"><span class="mono dashed">＋</span><span class="nm">Crear “${searchQuery.trim()}”</span></div>`;
  } else {
    const all = [...roster].sort((a, b) => a.name.localeCompare(b.name));
    ph += '<div class="sec">Jugadores</div>';
    ph += all.map(rowFor).join('');
  }
  document.getElementById('pool').innerHTML = ph;

  document.getElementById('confirmPlayers').disabled = !full;
}

function assignPlayer(id) {
  if (teamOfPlayer(id) >= 0) return;
  const cap = selectionCap();
  for (let t = 0; t < selection.slots.length; t++) {
    if (selection.slots[t].length < cap) { selection.slots[t].push(id); break; }
  }
  renderPlayersSelection();
}

function removeAssignment(id) {
  const t = teamOfPlayer(id);
  if (t >= 0) { selection.slots[t] = selection.slots[t].filter(x => x !== id); renderPlayersSelection(); }
}

function createFromSearch() {
  const name = searchQuery.trim();
  if (!name) return;
  const p = addRosterPlayer(name);
  searchQuery = '';
  const si = document.getElementById('playerSearch'); if (si) { si.value = ''; si.focus(); }
  if (p) assignPlayer(p.id);
  else renderPlayersSelection();
}

function deletePlayer(id) {
  roster = roster.filter(p => p.id !== id);
  saveRoster();
  if (selection && selection.slots) selection.slots = selection.slots.map(s => s.filter(x => x !== id));
  sbDelete('players', id);
  renderPlayersSelection();
}

function startTrackedGame() {
  const cap = selectionCap();
  if (!selection.slots.every(s => s.length === cap)) return;

  state.TARGET = initialPoints;
  state.mano   = 0;
  savedGallo   = null;
  undoStack    = [];
  quickMode    = false;

  if (selection.mode === 'gallo') {
    const teams = selection.slots.map(s => s.slice(0, 1));   // [[id],[id],[id]]
    state.teams = teams.map(s => ({ name: rosterName(s[0]), score: 0 }));
    rankedConfig = { active: true, teamSize: 1, mode: 'gallo', teams };
  } else {
    const fmt  = selection.format;
    const ids1 = selection.slots[0].slice(0, fmt);
    const ids2 = selection.slots[1].slice(0, fmt);
    state.teams = [
      { name: fmt === 1 ? rosterName(ids1[0]) : teamInitials(namesOf(ids1)), score: 0 },
      { name: fmt === 1 ? rosterName(ids2[0]) : teamInitials(namesOf(ids2)), score: 0 }
    ];
    rankedConfig = { active: true, teamSize: fmt, mode: 'normal', teams: [ids1, ids2] };
  }

  playersModal.classList.add('hidden');
  document.body.classList.remove('config');
  render();
  saveState();
}

// === MENU MODAL ===
const menuToggle = document.getElementById('menuToggle');

function closeMenuModal() {
  menuModal.classList.add('hidden');
}

if (menuToggle) menuToggle.addEventListener('click', () => {
  menuModal.classList.remove('hidden');
});

menuModal.querySelectorAll('.menu-item').forEach(item => {
  item.addEventListener('click', closeMenuModal);
});

// === INIT ===
loadTheme();
loadState();
loadHistory();   // caché local: muestra al instante
loadRoster();
syncRoster();    // refresca desde Supabase (fuente compartida)
syncHistory();
flushPending();  // reintenta escrituras que quedaron sin conexión
updateSyncStatus();
window.addEventListener('online',  async () => { await flushPending(); syncRoster(); syncHistory(); updateSyncStatus(); });
window.addEventListener('offline', updateSyncStatus);
document.body.classList.add('config'); // al inicio se muestra el modal de configuración
// Initial modal is shown by default
  </script>
